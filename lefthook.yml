# Runs before every commit. Install hooks with: bun install (runs `lefthook install`).
pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{js,ts,tsx,json,jsonc,css}"
      # Fixes formatting and import order itself and adds the fixes to the commit;
      # only real lint problems stop it.
      run: bunx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    typecheck:
      run: bun run typecheck
